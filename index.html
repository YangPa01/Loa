<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로아 꿀팁 & 정보 모음</title>
    <style>
        :root {
            --bg-color: #0f1117;
            --card-bg: #1a1d26;
            --accent-color: #61dafb;
            --primary-pink: #ff79c6;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #2e3440;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 25px;
        }

        .search-box {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: #fff;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
        }

        .card-category {
            font-size: 12px;
            background: #2e3440;
            padding: 4px 8px;
            border-radius: 4px;
            color: var(--accent-color);
        }

        .card-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            font-size: 12px;
            color: var(--accent-color);
        }

        /* 꿀팁 섹션 */
        .tip-section {
            margin-top: 40px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
        }

        .tip-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tip-form input[type="text"], .tip-form textarea {
            padding: 10px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
        }

        .tip-form button {
            padding: 10px;
            background-color: var(--primary-pink);
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .tip-table {
            width: 100%;
            border-collapse: collapse;
        }

        .tip-table th, .tip-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
        }

        .tip-title-link {
            color: var(--text-color);
            text-decoration: none;
        }

        .tip-title-link:hover {
            color: var(--accent-color);
        }

        .tip-del-btn {
            background: #ff5555;
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* 모달 스타일 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            border: 1px solid var(--border-color);
        }

        .modal-close {
            margin-top: 15px;
            background: var(--border-color);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<div class="container">
    <h1>🎮 로스트아크 링크 & 꿀팁 모음</h1>

    <input type="text" id="searchInput" class="search-box" placeholder="검색어를 입력하세요 (예: 버서커, 스킬코드, 서폿)..." onkeyup="filterCards()">

    <div class="filter-buttons">
        <button class="filter-btn active" onclick="setCategory('전체')">전체</button>
        <button class="filter-btn" onclick="setCategory('직업')">직업 게시판</button>
        <button class="filter-btn" onclick="setCategory('꿀팁')">유저 꿀팁</button>
    </div>

    <div class="grid" id="cardGrid"></div>

    <!-- 꿀팁 게시판 영역 (목록화 및 사진 첨부 추가) -->
    <div class="tip-section" id="tipSection">
        <h3>💡 나만의 꿀팁 공유하기</h3>
        <div class="tip-form">
            <input type="text" id="tipTitle" placeholder="제목을 입력하세요">
            <textarea id="tipContent" placeholder="자유롭게 팁을 작성하세요!"></textarea>
            <input type="file" id="tipImage" accept="image/*">
            <button onclick="addTip()">꿀팁 등록하기</button>
        </div>

        <table class="tip-table">
            <thead>
                <tr>
                    <th style="width: 60%;">제목</th>
                    <th style="width: 25%; text-align: center;">작성일</th>
                    <th style="width: 15%; text-align: center;">관리</th>
                </tr>
            </thead>
            <tbody id="tipTableBody"></tbody>
        </table>
    </div>
</div>

<!-- 꿀팁 상세보기 모달 -->
<div class="modal-overlay" id="tipModal">

    let currentCategory = '전체';

    function getStoredTips() {
        return JSON.parse(localStorage.getItem('loa_tips') || '[]');
    }

    function getCombinedData() {
        const tips = getStoredTips();
        const tipCards = tips.map(tip => ({
            title: tip.title,
            category: "꿀팁",
            desc: tip.content,
            tags: ["#유저꿀팁"],
            url: null,
            isTip: true,
            id: tip.id,
            date: tip.date,
            image: tip.image
        }));

        return [...linkData, ...tipCards];
    }

    function renderCards(data) {
        const grid = document.getElementById('cardGrid');
        grid.innerHTML = '';

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            
            const tagsHtml = item.tags.map(t => `<span class="tag">${t}</span>`).join(' ');
            
            let actionAttr = item.isTip 
                ? `onclick="openModal(${item.id})" style="cursor:pointer;"` 
                : `href="${item.url}" target="_blank"`;

            card.innerHTML = `
                <div>
                    <div class="card-header">
                        <a class="card-title" ${actionAttr}>${item.title}</a>
                        <span class="card-category">${item.category}</span>
                    </div>
                    <div class="card-desc">${item.desc}</div>
                </div>
                <div class="card-tags">${tagsHtml}</div>
            `;
            grid.appendChild(card);
        });
    }

    function filterCards() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const allData = getCombinedData();

        const filtered = allData.filter(item => {
            const matchesCat = (currentCategory === '전체') || (item.category === currentCategory);
            const matchesSearch = item.title.toLowerCase().includes(query) ||
                                  item.desc.toLowerCase().includes(query) ||
                                  item.tags.some(t => t.toLowerCase().includes(query));
            return matchesCat && matchesSearch;
        });

        renderCards(filtered);
    }

    function setCategory(cat) {
        currentCategory = cat;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText === cat);
        });
        filterCards();
    }

    // 모달 제어
    function openModal(id) {
        const tips = getStoredTips();
        const tip = tips.find(t => t.id === id);
        if (!tip) return;

        document.getElementById('modalTitle').innerText = tip.title;
        document.getElementById('modalContent').innerText = tip.content;
        
        const imgContainer = document.getElementById('modalImageContainer');
        if (tip.image) {
            imgContainer.innerHTML = `<img src="${tip.image}" alt="첨부 이미지" style="max-width:100%; border-radius:8px; margin-top:10px;">`;
        } else {
            imgContainer.innerHTML = '';
        }

        document.getElementById('tipModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('tipModal').style.display = 'none';
    }

    // 꿀팁 로직
    function addTip() {
        const titleInput = document.getElementById('tipTitle');
        const contentInput = document.getElementById('tipContent');
        const imageInput = document.getElementById('tipImage');

        if (!titleInput.value.trim() || !contentInput.value.trim()) {
            alert('제목과 내용을 모두 입력해주세요.');
            return;
        }

        const file = imageInput.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                saveTipData(titleInput.value, contentInput.value, e.target.result);
            };
            reader.readAsDataURL(file);
        } else {
            saveTipData(titleInput.value, contentInput.value, null);
        }
    }

    function saveTipData(title, content, imageData) {
        const tips = getStoredTips();
        const newTip = {
            id: Date.now(),
            title: title,
            content: content,
            image: imageData,
            date: new Date().toLocaleDateString()
        };

        tips.unshift(newTip);
        try {
            localStorage.setItem('loa_tips', JSON.stringify(tips));
        } catch(e) {
            alert('이미지 용량이 너무 큽니다. 더 작은 용량의 이미지를 올려주세요.');
            return;
        }

        document.getElementById('tipTitle').value = '';
        document.getElementById('tipContent').value = '';
        document.getElementById('tipImage').value = '';

        alert('꿀팁이 등록되었습니다!');
        renderTips();
        filterCards();
    }

    function deleteTip(id) {
        if (!confirm('정말 삭제하시겠습니까?')) return;
        let tips = getStoredTips();
        tips = tips.filter(t => t.id !== id);
        localStorage.setItem('loa_tips', JSON.stringify(tips));
        renderTips();
        filterCards();
    }

    function renderTips() {
        const tbody = document.getElementById('tipTableBody');
        const tips = getStoredTips();

        if (tips.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color: var(--text-muted); padding:30px;">등록된 꿀팁이 없습니다. 작성해 보세요!</td></tr>';
            return;
        }

        tbody.innerHTML = '';
        tips.forEach(tip => {
            const hasImgTag = tip.image ? '<span style="font-size:11px; background:var(--primary-pink); color:#fff; padding:2px 6px; border-radius:4px;">사진</span>' : '';
            tbody.innerHTML += `
                <tr>
                    <td>
                        <a class="tip-title-link" onclick="openModal(${tip.id})" style="cursor:pointer; font-weight:600;">
                            ${tip.title} ${hasImgTag}
                        </a>
                    </td>
                    <td style="text-align: center; color: var(--text-muted); font-size: 13px;">${tip.date}</td>
                    <td style="text-align: center;">
                        <button class="tip-del-btn" onclick="deleteTip(${tip.id})">삭제</button>
                    </td>
                </tr>
            `;
        });
    }

    // 초기화 실행
    filterCards();
    renderTips();
</script>

</body>
</html>
